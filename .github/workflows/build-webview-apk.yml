
name: Build ACW Astrology WebView APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Vite dependencies
        run: npm ci

      - name: Build Vite website
        run: npx vite build --base=./

      - name: Create WebView Android project
        shell: bash
        run: |
          mkdir -p android-webview/app/src/main/java/com/app/acwdestiny
          mkdir -p android-webview/app/src/main/assets/www
          mkdir -p android-webview/app/src/main/res/values

          cp -r dist/. android-webview/app/src/main/assets/www/

          cat > android-webview/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ACW-Astrology-WebView"
          include ':app'
          EOF

          cat > android-webview/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-webview/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.app.acwdestiny'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.app.acwdestiny'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > android-webview/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-webview/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">阿赞旺 命理系统</string>
          </resources>
          EOF

          cat > android-webview/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#211F6E</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#211F6E</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android-webview/app/src/main/java/com/app/acwdestiny/MainActivity.java <<'EOF'
          package com.app.acwdestiny;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.GeolocationPermissions;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{android.Manifest.permission.ACCESS_FINE_LOCATION, android.Manifest.permission.ACCESS_COARSE_LOCATION}, 100);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                          String origin,
                          GeolocationPermissions.Callback callback
                      ) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(
                              request.getUrl()
                          );
                      }
                  });

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/www/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile WebView APK
        run: gradle --no-daemon -p android-webview assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACW-Astrology-WebView-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
